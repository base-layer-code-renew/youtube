<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #212121;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 80%;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background-color: #ff0000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 8px;
        }
        .blocked { color: #ff5555; }
        .time-info { color: #aaa; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="allowed-section" style="display: none;">
            <h2>⭕️ 利用可能時間です</h2>
            <p>YouTubeを閲覧できます。</p>
            <a href="https://www.youtube.com" class="btn">YouTubeを開く</a>
        </div>

        <div id="blocked-section" style="display: none;">
            <h2 class="blocked">❌ 時間外です</h2>
            <p>現在はYouTubeを開けません。</p>
            <p class="time-info">利用可能時間: 21:00 〜 22:30</p>
        </div>
    </div>

    <script>
        function checkTime() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const startMinutes = 21 * 60;      // 21:00 (1260分)
            const endMinutes = 22 * 60 + 30;  // 22:30 (1350分)

            const isAllowed = currentMinutes >= startMinutes && currentMinutes <= endMinutes;

            document.getElementById('allowed-section').style.display = isAllowed ? 'block' : 'none';
            document.getElementById('blocked-section').style.display = isAllowed ? 'none' : 'block';
        }

        checkTime();
        setInterval(checkTime, 10000); // 10秒ごとに自動判定
    </script>

</body>
</html>
